<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }

        h1 {
            color: white;
            font-size: 50px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        }

        .subtitle {
            color: white;
            font-size: 22px;
            margin-bottom: 20px;
        }

        #turn {
            color: #FFD700;
            font-weight: bold;
        }

        button {
            padding: 12px 30px;
            margin-bottom: 25px;
            border: none;
            border-radius: 10px;
            background: #FFD700;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #FFC107;
            transform: scale(1.05);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            background: rgba(255, 255, 255, .15);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
        }

        .box {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            font-weight: bold;
            color: #4f46e5;
            cursor: pointer;
            transition: .3s;
        }

        .box:hover {
            background: #eef2ff;
            transform: scale(1.05);
        }

        .result {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .result h2 {
            color: white;
            font-size: 60px;
            margin-bottom: 30px;
        }

        .result button {
            margin: 0;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <p class="subtitle">
        Player Turn :
        <span id="turn">X</span>
    </p>

    <button onclick="restartGame()">Restart Game</button>

    <div class="container">

        <div onclick="handleClick(this)" id="0" class="box"></div>
        <div onclick="handleClick(this)" id="1" class="box"></div>
        <div onclick="handleClick(this)" id="2" class="box"></div>
        <div onclick="handleClick(this)" id="3" class="box"></div>
        <div onclick="handleClick(this)" id="4" class="box"></div>
        <div onclick="handleClick(this)" id="5" class="box"></div>
        <div onclick="handleClick(this)" id="6" class="box"></div>
        <div onclick="handleClick(this)" id="7" class="box"></div>
        <div onclick="handleClick(this)" id="8" class="box"></div>

    </div>

    <div id="result" class="result">
        <h2 id="winnerText"></h2>
        <button onclick="restartGame()">
            Play Again
        </button>

    </div>

    <script>
        let player = "X";
        let gameOver = false;
        const array = [null, null, null, null, null, null, null, null, null];

        function winner() {
            if (
                (array[0] !== null && array[0] == array[1] && array[1] == array[2]) ||
                (array[3] !== null && array[3] == array[4] && array[4] == array[5]) ||
                (array[6] !== null && array[6] == array[7] && array[7] == array[8]) ||
                (array[0] !== null && array[0] == array[3] && array[3] == array[6]) ||
                (array[1] !== null && array[1] == array[4] && array[4] == array[7]) ||
                (array[2] !== null && array[2] == array[5] && array[5] == array[8]) ||
                (array[0] !== null && array[0] == array[4] && array[4] == array[8]) ||
                (array[2] !== null && array[2] == array[4] && array[4] == array[6])
            ) {

                gameOver = true;
                document.getElementById("winnerText").innerHTML =
                    " " + player + " Wins! ";
                document.getElementById("result").style.display = "flex";
                return;
            }

            if (!array.includes(null)) {
                gameOver = true;
                document.getElementById("winnerText").innerHTML =
                    " It's a Draw!";
                document.getElementById("result").style.display = "flex";
            }

        }

        function handleClick(i) {
            if (gameOver) return;
            const id = Number(i.id);
            if (array[id] !== null) return;
            array[id] = player;
            i.innerText = player;
            winner();
            if (gameOver) return;
            player = player === "X" ? "O" : "X";
            document.getElementById("turn").innerText = player;

        }

        function restartGame() {
            player = "X";
            gameOver = false;
            document.getElementById("turn").innerText = "X";
            document.getElementById("result").style.display = "none";
            for (let i = 0; i < array.length; i++) {
                array[i] = null;
                document.getElementById(i).innerText = "";
            }
        }

    </script>

</body>

</html>
